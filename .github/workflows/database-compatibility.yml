name: Database compatibility
# Master pushes run these phases inside release validation, including maintenance-only changes.
# Keep standalone PR feedback and explicit manual diagnostics; never duplicate a push run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/database-compatibility.yml'
      - 'scripts/testing/**'
      - 'deploy/scripts/release-*.sh'
      - 'scripts/deploy/**'
      - 'rds/**'
      - 'server/backend/db/**'
      - 'server/backend/scripts/*rds*'
      - 'server/backend/scripts/*order-observation-schema*'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install local PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          SCHEMA_TEST_PG_BIN="$(dirname "$(find /usr/lib/postgresql -type f -name initdb | sort -V | tail -n 1)")"
          test -x "$SCHEMA_TEST_PG_BIN/pg_ctl"
          echo "CHANGMEN_TEST_PG_BIN=$SCHEMA_TEST_PG_BIN" >> "$GITHUB_ENV"
      - name: Exercise all required database compatibility phases
        run: node scripts/deploy/check-database-compatibility.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: database-compatibility-report
          path: output/database-compatibility/
          if-no-files-found: ignore
          retention-days: 14
