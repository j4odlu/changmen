name: Deploy frontend

on:
  push:
    branches: [master]
    paths:
      - 'client/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/deploy-frontend.yml'
      - 'scripts/deploy/publish.sh'
      - 'scripts/deploy/wait-for-backend*.mjs'
      - 'deploy/scripts/release-common.sh'
      - 'deploy/scripts/release-frontend.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check boundaries and build frontend (includes vue-tsc)
        env:
          VITE_PREDICT_FUN_API_BASE: https://api.predict.fun
        run: |
          npm run check:boundaries
          node --test scripts/deploy/classify-deploy-scope.test.mjs scripts/deploy/workflows.test.mjs scripts/deploy/deploy-plan.test.mjs scripts/deploy/compare-deployed-files.test.mjs scripts/deploy/wait-for-backend.test.mjs
          bash scripts/deploy/release.test.sh
          npm run test --workspace=@changmen/web
          npm run app:build
      - name: Wait for matching backend when push changes both components
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy/wait-for-backend.mjs
      - name: Publish frontend
        env:
          DEPLOY_HOST: '47.57.10.202'
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/deploy/publish.sh frontend
