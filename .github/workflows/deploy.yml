name: deploy changmen

on:
  push:
    branches: [master]
    paths:
      - "client/**"
      - "server/**"
      - "packages/**"
      - "deploy/**"
      - "scripts/deploy/**"
      - ".github/workflows/deploy.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      full_deploy:
        description: "Force full FE+BE deploy (ignore path classify)"
        required: false
        default: false
        type: boolean
      scope:
        description: "Manual scope override: auto | frontend | backend | full"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - frontend
          - backend
          - full

concurrency:
  group: deploy-changmen-hongkong
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.out.outputs.scope }}
      reason: ${{ steps.out.outputs.reason }}
      frontend: ${{ steps.out.outputs.frontend }}
      backend: ${{ steps.out.outputs.backend }}
      noop: ${{ steps.out.outputs.noop }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify deploy scope (step 5)
        id: out
        env:
          DEPLOY_FORCE_FULL: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.full_deploy == 'true' || github.event.inputs.scope == 'full')) && '1' || '0' }}
          MANUAL_SCOPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scope || 'auto' }}
        run: |
          set -euo pipefail
          # full_deploy wins over a narrower manual scope
          if [[ "${DEPLOY_FORCE_FULL}" == "1" ]]; then
            {
              echo "scope=full"
              echo "reason=force_full"
              echo "frontend=true"
              echo "backend=true"
              echo "noop=false"
            } >> "$GITHUB_OUTPUT"
            echo "forced full deploy"
            exit 0
          fi
          if [[ "${MANUAL_SCOPE}" == "frontend" || "${MANUAL_SCOPE}" == "backend" || "${MANUAL_SCOPE}" == "full" ]]; then
            fe=false; be=false
            [[ "${MANUAL_SCOPE}" == "frontend" || "${MANUAL_SCOPE}" == "full" ]] && fe=true
            [[ "${MANUAL_SCOPE}" == "backend" || "${MANUAL_SCOPE}" == "full" ]] && be=true
            {
              echo "scope=${MANUAL_SCOPE}"
              echo "reason=manual_${MANUAL_SCOPE}"
              echo "frontend=${fe}"
              echo "backend=${be}"
              echo "noop=false"
            } >> "$GITHUB_OUTPUT"
            echo "manual scope=${MANUAL_SCOPE}"
            exit 0
          fi
          FROM="${{ github.event.before }}"
          TO="${{ github.sha }}"
          node scripts/deploy/classify-deploy-scope-cli.mjs --from "${FROM}" --to "${TO}"
          echo "classified:"
          cat "$GITHUB_OUTPUT"

  build:
    needs: classify
    if: needs.classify.outputs.frontend == 'true' || needs.classify.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIST_ARCHIVE: /tmp/changmen-dist.tgz
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate backend route modules for clean CI checkout
        run: npm run compile:router --workspace=@changmen/backend

      - name: Verify repository before deployment
        run: npm test

      - name: Build frontend dist
        if: needs.classify.outputs.frontend == 'true'
        env:
          VITE_PREDICT_FUN_API_BASE: https://api.predict.fun
          VITE_PREDICT_FUN_API_KEY: ${{ secrets.PREDICT_FUN_API_KEY }}
          VITE_PREDICT_FUN_PRIVY_PRIVATE_KEY: ${{ secrets.PREDICT_FUN_PRIVY_PRIVATE_KEY }}
          VITE_PREDICT_FUN_PREDICT_ACCOUNT: ${{ secrets.PREDICT_FUN_PREDICT_ACCOUNT }}
          VITE_PREDICT_FUN_MASTER_PRIVATE_KEY: ${{ secrets.PREDICT_FUN_MASTER_PRIVATE_KEY }}
        run: npm run app:build

      - name: Pack frontend dist
        if: needs.classify.outputs.frontend == 'true'
        run: |
          test -f client/web/dist/index.html
          test -d client/web/dist/assets
          ls client/web/dist/assets/index*.js >/dev/null
          ls client/web/dist/assets/venue-shared*.js >/dev/null
          ls client/web/dist/assets/venue-ob*.js >/dev/null
          tar -C client/web/dist -czf "${DIST_ARCHIVE}" .
          ls -lh "${DIST_ARCHIVE}"
          # Prove production API base is baked (step 4+)
          if ! grep -Rql 'https://api.changmen.fun' client/web/dist/assets/; then
            echo "ERROR: dist missing VITE_API_BASE https://api.changmen.fun" >&2
            exit 1
          fi

      - name: Upload dist artifact
        if: needs.classify.outputs.frontend == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist-${{ github.sha }}
          path: /tmp/changmen-dist.tgz
          retention-days: 3
          if-no-files-found: error

  deploy-backend:
    needs: [classify, build]
    if: |
      always()
      && needs.classify.outputs.backend == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: "47.57.10.202"
      DEPLOY_FULL: ${{ github.event.inputs.full_deploy == 'true' && '1' || '0' }}
      REPO_ARCHIVE: /tmp/changmen-repo.tgz
      REMOTE_DEPLOY_SCRIPTS: /tmp/changmen-deploy

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Resolve deploy host (hongkong production)
        run: |
          test -n "${DEPLOY_SSH_KEY}" || (echo "Missing secret DEPLOY_SSH_KEY" && exit 1)
          echo "DEPLOY_USER=${DEPLOY_USER:-root}" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"
          echo "DEPLOY_REPO=${DEPLOY_REPO:-/root/changmen}" >> "$GITHUB_ENV"
          echo "Deploying BACKEND to production HK-202 (${DEPLOY_HOST})"

      - name: Record source changes since the last successful production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASELINE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?status=success&branch=master&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
          if [[ -n "${BASELINE_SHA}" ]] && git cat-file -e "${BASELINE_SHA}^{commit}"; then
            git diff --name-only "${BASELINE_SHA}" HEAD > /tmp/changmen-changed-paths.txt
          elif [[ -z "${BASELINE_SHA}" ]]; then
            # First release: conservatively classify all tracked paths.
            git ls-files > /tmp/changmen-changed-paths.txt
          else
            echo "ERROR: production baseline commit unavailable; refusing unverified classification" >&2
            exit 1
          fi

      - name: Verify archive deployment plan
        run: node --test scripts/deploy/deploy-plan.test.mjs

      - name: Pack app archive (git HEAD only)
        run: |
          test -f package.json
          test -f scripts/deploy/pack-git-repo.mjs
          node --input-type=module -e "import { packGitRepoArchive } from './scripts/deploy/pack-git-repo.mjs'; packGitRepoArchive(process.cwd(), process.env.REPO_ARCHIVE)"
          tar -tzf "${REPO_ARCHIVE}" >/dev/null
          ls -lh "${REPO_ARCHIVE}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload app archive and deploy scripts (hongkong)
        run: |
          LOCAL_SHA="$(sha256sum "${REPO_ARCHIVE}" | awk '{print $1}')"
          LOCAL_SIZE="$(stat -c%s "${REPO_ARCHIVE}")"
          echo "local repo archive: ${LOCAL_SIZE} bytes sha256=${LOCAL_SHA}"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "rm -f /tmp/changmen-repo.upload.tgz /tmp/changmen-repo.tgz"
          ok=0
          for attempt in 1 2 3; do
            echo "upload attempt ${attempt}"
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cat > /tmp/changmen-repo.upload.tgz" < "${REPO_ARCHIVE}"
            if ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "set -euo pipefail
               test \"\$(stat -c%s /tmp/changmen-repo.upload.tgz)\" -eq ${LOCAL_SIZE}
               echo ${LOCAL_SHA}  /tmp/changmen-repo.upload.tgz | sha256sum -c -
               tar -tzf /tmp/changmen-repo.upload.tgz >/dev/null
               mv /tmp/changmen-repo.upload.tgz /tmp/changmen-repo.tgz
               mkdir -p ${REMOTE_DEPLOY_SCRIPTS}"; then
              ok=1
              break
            fi
            echo "upload attempt ${attempt} failed; retrying..."
            sleep 2
          done
          test "$ok" = "1"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            deploy/scripts/apply-repo-archive.sh deploy/scripts/deploy-server-remote.sh \
            deploy/scripts/sync-hk-relay-env-remote.sh /tmp/changmen-changed-paths.txt \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DEPLOY_SCRIPTS}/"

      - name: Apply archive and service deploy (hongkong)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
            sed -i 's/\\r$//' ${REMOTE_DEPLOY_SCRIPTS}/*.sh
            export DEPLOY_REPO='${DEPLOY_REPO:-/root/changmen}' CHANGMEN_DEPLOY_SCRIPTS='${REMOTE_DEPLOY_SCRIPTS}' DEPLOY_SKIP_APP_BUILD=1 DEPLOY_SKIP_POSTCHECK=1 DEPLOY_FULL='${DEPLOY_FULL}' DEPLOY_CHANGED_PATHS_FILE='${REMOTE_DEPLOY_SCRIPTS}/changmen-changed-paths.txt'
            if [ ! -d \"\${DEPLOY_REPO}/server/backend\" ] && [ -d /root/gamebet ]; then
              echo '==> migrate /root/gamebet -> '\${DEPLOY_REPO}
              mv /root/gamebet \"\${DEPLOY_REPO}\"
            fi
            bash ${REMOTE_DEPLOY_SCRIPTS}/apply-repo-archive.sh /tmp/changmen-repo.tgz
            find \"\${DEPLOY_REPO}/deploy/scripts\" -name '*.sh' -exec sed -i 's/\\r$//' {} +"

      - name: Run post-deploy check (hongkong)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_REPO:-/root/changmen}/server/backend' && node scripts/ops/diagnostics/post-deploy-check.mjs"

      - name: Sync HK relay env (hongkong)
        env:
          PREDICT_FUN_API_KEY: ${{ secrets.PREDICT_FUN_API_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e
            repo='${DEPLOY_REPO:-/root/changmen}'
            for i in 1 2 3 4 5; do
              if [ -f \"\$repo/server/backend/.env\" ]; then break; fi
              sleep 1
            done
            test -f \"\$repo/server/backend/.env\"
            cd \"\$repo\" && PREDICT_FUN_API_KEY='${PREDICT_FUN_API_KEY}' bash deploy/scripts/sync-hk-relay-env-remote.sh"

      - name: Probe HK relay (hongkong)
        env:
          PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}
          PREDICT_FUN_API_KEY: ${{ secrets.PREDICT_FUN_API_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_REPO:-/root/changmen}/server/backend' && PROBE_TOKEN='${PROBE_TOKEN}' PREDICT_FUN_API_KEY='${PREDICT_FUN_API_KEY}' node scripts/ops/diagnostics/probe-hk-relay.mjs --skip-ws" \
            || echo "WARN: probe-hk-relay failed (set GitHub secret PROBE_TOKEN if HTTP_RELAY_REQUIRE_TOKEN=1)"

      - name: Verify production homepage (hongkong)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "curl -sf -o /dev/null http://127.0.0.1:3456/ || curl -sf -o /dev/null http://127.0.0.1/"

  deploy-frontend:
    needs: [classify, build, deploy-backend]
    if: |
      always()
      && needs.classify.outputs.frontend == 'true'
      && needs.build.result == 'success'
      && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: "47.57.10.202"
      DIST_ARCHIVE: /tmp/changmen-dist.tgz

    steps:
      - name: Resolve deploy host
        run: |
          test -n "${DEPLOY_SSH_KEY}" || (echo "Missing secret DEPLOY_SSH_KEY" && exit 1)
          echo "DEPLOY_USER=${DEPLOY_USER:-root}" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"
          echo "DEPLOY_REPO=${DEPLOY_REPO:-/root/changmen}" >> "$GITHUB_ENV"
          echo "Deploying FRONTEND dist only to HK-202 (${DEPLOY_HOST}) — no pm2"

      - name: Download dist artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist-${{ github.sha }}
          path: /tmp

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload frontend dist archive (hongkong)
        run: |
          LOCAL_SHA="$(sha256sum "${DIST_ARCHIVE}" | awk '{print $1}')"
          LOCAL_SIZE="$(stat -c%s "${DIST_ARCHIVE}")"
          echo "local dist archive: ${LOCAL_SIZE} bytes sha256=${LOCAL_SHA}"
          ok=0
          for attempt in 1 2 3; do
            echo "dist upload attempt ${attempt}"
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cat > /tmp/changmen-dist-${GITHUB_SHA}.tgz" < "${DIST_ARCHIVE}"
            if ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "set -euo pipefail
               test \"\$(stat -c%s /tmp/changmen-dist-${GITHUB_SHA}.tgz)\" -eq ${LOCAL_SIZE}
               echo ${LOCAL_SHA}  /tmp/changmen-dist-${GITHUB_SHA}.tgz | sha256sum -c -
               tar -tzf /tmp/changmen-dist-${GITHUB_SHA}.tgz >/dev/null"; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = "1"

      - name: Atomically replace remote frontend dist (hongkong)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
            archive='/tmp/changmen-dist-${GITHUB_SHA}.tgz'
            app='${DEPLOY_REPO:-/root/changmen}/client/web'
            tmp=\"\$app/dist.upload.${GITHUB_RUN_ID}\"
            tar -tzf \"\$archive\" >/dev/null
            rm -rf \"\$tmp\"
            mkdir -p \"\$tmp\"
            tar -xzf \"\$archive\" -C \"\$tmp\"
            test -f \"\$tmp/index.html\"
            test -d \"\$tmp/assets\"
            ls \"\$tmp\"/assets/index*.js >/dev/null
            ls \"\$tmp\"/assets/venue-shared*.js >/dev/null
            ls \"\$tmp\"/assets/venue-ob*.js >/dev/null
            rm -rf \"\$app/dist.prev\"
            if [ -d \"\$app/dist\" ]; then mv \"\$app/dist\" \"\$app/dist.prev\"; fi
            mv \"\$tmp\" \"\$app/dist\"
            rm -rf \"\$app/dist.prev\"
            rm -f \"\$archive\" \"\$app/.deploy-needs-dist-upload\"
            chmod 711 /root 2>/dev/null || true
            chmod -R a+rX \"\$app/dist\"
            echo \"OK frontend-only dist; pm2 untouched\""

      - name: Verify production homepage (hongkong)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "curl -sf -o /dev/null http://127.0.0.1:3456/ || curl -sf -o /dev/null http://127.0.0.1/"
