name: Validate and release
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      component:
        description: Component to publish
        type: choice
        default: full
        options: [full, backend, frontend]
permissions:
  contents: read
# Independent runners validate the same pinned candidate before sealing.
concurrency:
  group: changmen-release-production
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      backend-first: ${{ steps.plan.outputs.backend-first }}
      matrix: ${{ steps.lanes.outputs.matrix }}
      has-checks: ${{ steps.lanes.outputs.has-checks }}
      database-compatibility: ${{ steps.plan.outputs.database-compatibility }}
      backend-installation: ${{ steps.plan.outputs.backend-installation }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Prepare read-only version check
        if: github.event_name == 'push'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          CAPTURE_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$CAPTURE_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$CAPTURE_SSH_KEY" > "$RUNNER_TEMP/release-capture-key"
          chmod 600 "$RUNNER_TEMP/release-capture-key"
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H 47.57.10.202 >> ~/.ssh/known_hosts
          printf 'Host 47.57.10.202\n  Port %s\n' "${DEPLOY_PORT:-22}" >> ~/.ssh/config
          printf 'FOK_BASELINE_SSH_KEY=%s\nFOK_BASELINE_SSH_TARGET=%s@47.57.10.202\n' "$RUNNER_TEMP/release-capture-key" "${DEPLOY_USER:-root}" >> "$GITHUB_ENV"
      - name: Read active release baselines
        if: github.event_name == 'push'
        run: |
          node scripts/deploy/read-deployed-versions.mjs
          echo 'CI_DEPLOYED_VERSIONS_FILE=output/change-validation/deployed-versions.json' >> "$GITHUB_ENV"
      - name: Remove capture key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release-capture-key"
          echo 'FOK_BASELINE_SSH_KEY=' >> "$GITHUB_ENV"
          echo 'FOK_BASELINE_SSH_TARGET=' >> "$GITHUB_ENV"
      - name: Resolve change plan
        id: plan
        run: node scripts/deploy/change-plan.mjs
      - name: Assign independent checks
        id: lanes
        run: node scripts/deploy/release-checks.mjs prepare
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          overwrite: true
          path: |
            output/change-validation/plan.json
            output/change-validation/bundle.json
            output/change-validation/node-version
          if-no-files-found: error
          retention-days: 14
  checks:
    needs: plan
    if: needs.plan.outputs.has-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: output/change-validation/
      - uses: actions/setup-node@v5
        with:
          node-version-file: output/change-validation/node-version
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL for required checks
        if: matrix.lane == 'backend' && (needs.plan.outputs.database-compatibility == 'true' || needs.plan.outputs.backend-installation == 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          SCHEMA_TEST_PG_BIN="$(dirname "$(find /usr/lib/postgresql -type f -name initdb | sort -V | tail -n 1)")"
          test -x "$SCHEMA_TEST_PG_BIN/pg_ctl"
          echo "CHANGMEN_TEST_PG_BIN=$SCHEMA_TEST_PG_BIN" >> "$GITHUB_ENV"
      - name: Check selected components and build
        env:
          VITE_PREDICT_FUN_API_BASE: https://api.predict.fun
          RELEASE_LANE: ${{ matrix.lane }}
        run: node scripts/deploy/release-checks.mjs run "$RELEASE_LANE"
      - name: Store lane results and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-lane-${{ matrix.lane }}
          overwrite: true
          path: output/release-lanes/
          if-no-files-found: error
          retention-days: 14
      - name: Store failed check diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-acceptance-${{ matrix.lane }}
          overwrite: true
          path: |
            output/change-validation/
            output/database-compatibility/
            output/backend-linux-runtime/*.log
            output/backend-linux-runtime/verdict.json
            output/release-lanes/
          retention-days: 7
  validate:
    needs: [plan, checks]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    outputs:
      backend: ${{ needs.plan.outputs.backend }}
      frontend: ${{ needs.plan.outputs.frontend }}
      backend-first: ${{ needs.plan.outputs.backend-first }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: output/change-validation/
      - uses: actions/setup-node@v5
        with:
          node-version-file: output/change-validation/node-version
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.has-checks == 'true'
        with:
          pattern: release-lane-*
          path: output/release-lanes/
          merge-multiple: true
      - name: Require every planned check for this candidate
        run: node scripts/deploy/release-checks.mjs collect
      - name: Require successful check jobs
        env:
          HAS_CHECKS: ${{ needs.plan.outputs.has-checks }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "$HAS_CHECKS" == 'true' ]]; then
            test "$CHECKS_RESULT" = 'success'
          else
            test "$CHECKS_RESULT" = 'skipped'
          fi
      - name: Seal commit and artifacts
        run: node scripts/deploy/release-evidence.mjs seal
      - name: Store acceptance and exact release archives
        uses: actions/upload-artifact@v7
        with:
          name: verified-release
          overwrite: true
          path: output/release-validation/
          if-no-files-found: error
          retention-days: 14
      - name: Store failed acceptance report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-acceptance
          overwrite: true
          path: |
            output/change-validation/
            output/database-compatibility/
            output/release-lanes/*.json
          retention-days: 7
      - name: Summarize acceptance and failures
        if: always()
        env:
          ACCEPTANCE_JOB_STATUS: ${{ job.status }}
        run: node scripts/deploy/release-summary.mjs
  backend:
    needs: validate
    if: needs.validate.outputs.backend == 'true'
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit
  frontend:
    needs: validate
    if: needs.validate.outputs.frontend == 'true' && needs.validate.outputs.backend-first != 'true'
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
  frontend_after_backend:
    needs: [validate, backend]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
          needs.validate.outputs.frontend == 'true' &&
          needs.validate.outputs.backend-first == 'true' && needs.backend.result == 'success' }}
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
