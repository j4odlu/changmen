<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>じらいや · PB</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 12px 12px 24px;
      box-sizing: border-box;
      background: #1a1d24;
      color: #e8eaed;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #0c0e24;
      flex-shrink: 0;
    }
    p { margin: 4px 0; font-size: 12px; color: #9aa0a6; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0 4px; }
    .row label { font-size: 13px; color: #e8eaed; }
    .hint { font-size: 11px; color: #7a858f; line-height: 1.4; }
    .status { font-size: 11px; color: #b0b8c0; margin-top: 8px; white-space: pre-wrap; }
    .status.ok { color: #3dd68c; }
    .status.err { color: #f87171; }
    .meta { margin-top: 8px; padding: 8px; background: #22262e; border-radius: 6px; font-size: 11px; line-height: 1.45; color: #9aa0a6; }
    .ok { color: #3dd68c; }
    .miss { color: #f87171; }
    .release { margin: 12px 0; padding: 10px; background: #22262e; border-radius: 6px; }
    .release a { color: #60a5fa; margin-left: 10px; }
    .release button { cursor: pointer; padding: 5px 8px; }
  </style>
</head>
<body>
  <h1><img src="assets/icon128.png" alt="" />じらいや · PB</h1>
  <p>版本：<span id="ver">…</span> · 侧边栏</p>
  <section class="release" aria-label="插件更新">
    <p id="updateStatus" role="status">正在检查插件版本…</p>
    <p>最新版本：<span id="latestVersion">—</span></p>
    <button id="checkUpdate" type="button">检查更新</button>
    <a id="downloadUpdate" hidden target="_blank" rel="noopener">下载插件</a>
    <p class="hint">下载后解压，将文件覆盖原插件目录，在 chrome://extensions/ 点击“重新加载”，再刷新网页。PM 会话需首次重新解锁。</p>
  </section>

  <div class="row">
    <label for="pbWs">PB WebSocket 观测</label>
    <input type="checkbox" id="pbWs" checked />
  </div>
  <p class="hint">观测只给主站影子价灌官网 WS / 页内 euro，不写主价。旁显在网页「用户中心 → 扩展」。</p>
  <p id="pbStatus" class="status">状态：—</p>
  <div id="pbSubs" class="meta">订阅：—</div>

  <script src="popup.js"></script>
</body>
</html>
